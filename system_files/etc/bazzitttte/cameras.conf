# bazzitttte network cameras - used by 'ujust bazzitttte-cam-*' recipes.
#
# One camera per line:
#   <name> <stream-url> [motion-threshold]
#
# - <name>             short id you'll pass to the recipes (no spaces)
# - <stream-url>       RTSP (or HTTP/MJPEG) stream URL of the camera
# - [motion-threshold] optional; higher = less sensitive (default 10)
#
# Examples (uncomment and edit to match your cameras):
# frontdoor rtsp://192.168.1.50:554/stream1
# backyard  rtsp://user:pass@192.168.1.51:554/live 12
# garage    http://192.168.1.52/mjpeg 8
